# Workflow du MIROIR PUBLIC kimen26/IArtcane-site.
# Ce fichier vit dans site/.github/ du repo privé ; le subtree push le place
# à la racine .github/workflows/ du miroir, dont le contenu = site/ entier.
name: Déploiement Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
